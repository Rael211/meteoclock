# Channel profile template. Copy to <channel_id>.yaml.
id: channel-id
display_name: "Channel Name"
language: en                 # default; brief may override
owner: Obla LLC

brand:
  font_primary: "Inter"      # must cover Cyrillic if language: bg
  font_display: "Inter"
  color_primary: "#1E6FE8"
  color_accent: "#F5B301"
  color_bg: "#0F1115"
  color_text: "#FFFFFF"
  logo: brand/logo.png

templates:
  intro: brand/intro.mp4      # optional
  outro: brand/outro.mp4      # optional
  lower_third: brand/lower_third.png
  chapter_card: brand/chapter_card.png
  thumbnail: brand/thumb_template.png

style:
  transition: cut             # cut | dissolve | slide
  transition_ms: 250
  still_motion: ken-burns     # ken-burns | static | zoom
  max_still_seconds: 8
  subtitle_position: bottom   # bottom | center
  subtitle_max_chars: 42
  safe_area_pct: 5

audio:
  voice_lufs: -16
  music_lufs: -23
  master_lufs: -14
  duck_db: -12
  music_library: assets/music/  # mood folders inside: calm-tech, upbeat, ...

targets:
  youtube-16x9: {w: 1920, h: 1080, fps: 30, vcodec: libx264, crf: 18, acodec: aac, abr: 192k}
  shorts-9x16:  {w: 1080, h: 1920, fps: 30, vcodec: libx264, crf: 20, acodec: aac, abr: 160k, max_seconds: 59}

tools:
  renderer: ffmpeg            # ffmpeg | remotion | canva
